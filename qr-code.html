<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Pad 6 - iPad用 QRコード共有</title>
    <style>
        body {
            background-color: #0f141c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #18202c;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .qr-container {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }
        .qr-image {
            width: 220px;
            height: 220px;
            display: block;
        }
        .url-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 14px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 20px;
        }
        .guide-steps {
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .guide-steps ol {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📱 iPad / iPhone で開く</h1>
        <p>iPadの標準カメラをこのQRコードにかざすと、アプリが起動します！</p>

        <div class="qr-container">
            <!-- QRコード画像 (Google Charts APIで自動生成) -->
            <img id="qr-img" class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=http://192.168.0.11:8080" alt="QR Code">
        </div>

        <div class="url-box" id="url-text">http://192.168.0.11:8080</div>

        <div class="guide-steps">
            <strong>📸 開き方の手順：</strong>
            <ol>
                <li>iPadの <strong>「カメラ」アプリ</strong> を開きます。</li>
                <li>上のQRコードを画面に映します。</li>
                <li>画面に表示される <strong>黄色いリンク</strong> をタップすると開きます！</li>
            </ol>
        </div>
    </div>
</body>
</html>
