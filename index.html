<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice Pad 6 - 6ボタン音声録音＆サンプラー</title>
    <meta name="description" content="iPhoneやiPadで簡単に音声を6つのボタンに録音・再生できるタッチサンプラーアプリ。ボイスチェンジャーやループ機能付き。">
    
    <!-- iOS / iPadOS Web App 最適化 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Voice Pad 6">
    <meta name="theme-color" content="#0f141c">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- アプリヘッダー -->
        <header class="app-header">
            <div class="logo-group">
                <div class="app-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="app-title">Voice Pad 6</h1>
                </div>
            </div>

            <!-- モード切り替えスイッチ (再生 / 録音) -->
            <div class="mode-switch-container">
                <button id="mode-play-btn" class="mode-toggle-btn active" data-mode="play">
                    <span class="mode-icon">▶️</span>
                    <span class="mode-label">再生モード</span>
                </button>
                <button id="mode-record-btn" class="mode-toggle-btn" data-mode="record">
                    <span class="mode-icon">🔴</span>
                    <span class="mode-label">録音モード</span>
                </button>
            </div>

            <!-- ヘッダー右側コントロール -->
            <div class="header-controls">
                <!-- ボイスチェンジャー（キャラクター＆環境エフェクト） -->
                <select id="voice-effect" class="voice-effect-select" title="ボイスチェンジャー">
                    <optgroup label="キャラクター">
                        <option value="normal">🎙️ 通常</option>
                        <option value="baby">👶 赤ちゃん</option>
                        <option value="boy">👦 男の子</option>
                        <option value="girl">👧 女の子</option>
                        <option value="man">👨 男の人</option>
                        <option value="woman">👩 女の人</option>
                        <option value="old_man">👴 おじいさん</option>
                        <option value="old_woman">👵 おばあさん</option>
                        <option value="alien">👽 宇宙人</option>
                        <option value="robot">🤖 ロボット</option>
                        <option value="monster">👹 怪獣</option>
                    </optgroup>
                    <optgroup label="環境・エフェクト">
                        <option value="cave">⛰️ 洞窟 (エコー)</option>
                        <option value="underwater">🫧 水の中</option>
                        <option value="radio">📻 古いラジオ</option>
                        <option value="telephone">📱 電話</option>
                        <option value="hall">🏛️ 大ホール</option>
                        <option value="megaphone">📢 メガホン</option>
                    </optgroup>
                </select>

                <!-- QRコード表示ボタン -->
                <button id="show-qr-btn" class="qr-share-btn" title="共有用QRコードを表示">
                    📱 QR
                </button>
            </div>
        </header>

        <!-- 6スロットメイングリッド -->
        <main id="pad-grid" class="pad-grid">
            <!-- JavaScript (app.js) で自動生成されます -->
        </main>
    </div>

    <!-- 設定・名前変更モーダル -->
    <div id="modal-backdrop" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">ボタン <span id="modal-slot-num">1</span> の設定</h3>
                <button id="close-modal-btn" class="close-modal-btn" title="閉じる">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="form-group">
                <label class="form-label" for="edit-label">ボタンの名前（ラベル）</label>
                <input type="text" id="edit-label" class="form-input" placeholder="例: こんにちは、パパの声..." maxlength="20">
            </div>

            <!-- 名前（ラベル）の位置選択 -->
            <div class="form-group">
                <label class="form-label">名前の位置（枠の中での位置）</label>
                <div class="position-selector">
                    <button type="button" class="pos-btn" data-pos="top">⬆️ 枠の一番上</button>
                    <button type="button" class="pos-btn" data-pos="center">⏺️ 枠の真ん中</button>
                    <button type="button" class="pos-btn active" data-pos="bottom">⬇️ 枠の一番下</button>
                </div>
                <input type="hidden" id="edit-label-pos" value="bottom">
            </div>

            <div class="form-group">
                <label class="form-label">アイコン（写真 または 絵文字）</label>
                
                <!-- 写真取り込み＆プレビュー・調整エリア -->
                <div class="photo-select-container">
                    <div class="photo-top-bar">
                        <button type="button" id="select-photo-btn" class="action-btn download-btn" style="margin: 0; padding: 7px 12px; font-size: 12px; flex: 1;">
                            📷 写真を撮る / アルバムから選ぶ
                        </button>
                        <button type="button" id="remove-photo-btn" class="action-btn delete-btn" style="display: none; margin: 0; padding: 7px 10px; font-size: 11px;">
                            🗑️ 写真を削除
                        </button>
                    </div>

                    <!-- 写真が選択されている時に表示される調整プレビューエリア -->
                    <div id="photo-adjust-box" class="photo-adjust-box" style="display: none;">
                        <div class="photo-adjust-header">
                            <span>🖼️ 写真の大きさ・位置の調整</span>
                            <span class="crop-hint">（プレビューをドラッグして移動）</span>
                        </div>

                        <!-- 実際のボタンと全く同じ形状・比率のインタラクティブ調整プレビュー枠 -->
                        <div class="photo-preview-wrapper">
                            <div id="photo-crop-viewport" class="photo-crop-viewport pad-card-preview">
                                <div class="crop-image-layer">
                                    <img id="photo-crop-img" src="" alt="preview">
                                </div>
                                <div class="pad-photo-overlay"></div>

                                <!-- プレビュー上の枠内上部（番号＆上位置ラベル） -->
                                <div class="preview-header">
                                    <span id="preview-slot-badge" class="slot-badge">1</span>
                                    <div id="preview-label-top" class="pad-label preview-label"></div>
                                    <div class="preview-dummy-btn">⚙️</div>
                                </div>

                                <!-- プレビュー上の枠内中央（中位置ラベル） -->
                                <div class="preview-body">
                                    <div id="preview-label-center" class="pad-label preview-label"></div>
                                </div>

                                <!-- プレビュー上の枠内下部（下位置ラベル＆秒数） -->
                                <div class="preview-footer">
                                    <div id="preview-label-bottom" class="pad-label preview-label"></div>
                                    <div id="preview-status" class="pad-status">未録音</div>
                                </div>
                            </div>
                        </div>

                        <!-- 拡大・縮小ズームスライダー -->
                        <div class="adjust-control-row">
                            <span class="adjust-label">🔍 大きさ</span>
                            <input type="range" id="photo-zoom-slider" min="50" max="300" value="100" class="adjust-slider">
                            <span id="photo-zoom-val" class="adjust-val">100%</span>
                        </div>

                        <!-- 位置微調整ボタン＆クイックフィット -->
                        <div class="adjust-tools-row">
                            <div class="dpad-container">
                                <button type="button" class="dpad-btn" data-move="up" title="上へ移動">⬆️</button>
                                <div class="dpad-middle">
                                    <button type="button" class="dpad-btn" data-move="left" title="左へ移動">⬅️</button>
                                    <button type="button" class="dpad-btn dpad-reset" data-move="reset" title="中央・等倍に戻す">🔄</button>
                                    <button type="button" class="dpad-btn" data-move="right" title="右へ移動">➡️</button>
                                </div>
                                <button type="button" class="dpad-btn" data-move="down" title="下へ移動">⬇️</button>
                            </div>

                            <div class="fit-mode-container">
                                <button type="button" id="btn-fit-cover" class="fit-mode-btn active" data-fit="cover">🔲 枠いっぱい</button>
                                <button type="button" id="btn-fit-contain" class="fit-mode-btn" data-fit="contain">🔳 全体を表示</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="emoji-selector" style="margin-top: 6px;">
                    <button type="button" class="emoji-opt">🔊</button>
                    <button type="button" class="emoji-opt">👋</button>
                    <button type="button" class="emoji-opt">🎉</button>
                    <button type="button" class="emoji-opt">🐶</button>
                    <button type="button" class="emoji-opt">🐱</button>
                    <button type="button" class="emoji-opt">🎵</button>
                    <button type="button" class="emoji-opt">⭐</button>
                    <button type="button" class="emoji-opt">❤️</button>
                </div>
                <input type="hidden" id="edit-emoji" value="🔊">
                <!-- 写真ファイル用インプット（カメラ・アルバム両対応） -->
                <input type="file" id="photo-file-input" accept="image/*" style="display: none;">
            </div>

            <div class="modal-actions">
                <button id="save-slot-btn" class="action-btn save-btn">設定を保存する</button>
                <button id="import-file-btn" class="action-btn download-btn">📁 好きな音声ファイルを読み込む</button>
                <button id="download-audio-btn" class="action-btn download-btn" style="display: none;">💾 録音音声をダウンロード</button>
                <button id="delete-audio-btn" class="action-btn delete-btn" style="display: none;">🗑️ 録音データを削除</button>
            </div>

            <input type="file" id="audio-file-input" accept="audio/*" style="display: none;">
        </div>
    </div>

    <!-- 📱 QRコード表示モーダル -->
    <div id="qr-modal-backdrop" class="modal-backdrop">
        <div class="modal-content" style="text-align: center; align-items: center; max-height: 95vh;">
            <div class="modal-header" style="width: 100%;">
                <h3 class="modal-title">📱 共有用 QRコード</h3>
                <button id="close-qr-modal-btn" class="close-modal-btn" title="閉じる">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- アドレスバーを消して全画面にする手順 -->
            <div style="background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; padding: 10px; width: 100%; text-align: left; margin-bottom: 12px;">
                <div style="font-weight: 800; font-size: 13px; color: #93c5fd; margin-bottom: 4px;">✨ Safariのタブ・アドレスバーを消す方法</div>
                <div style="font-size: 12px; color: #cbd5e1; line-height: 1.5;">
                    Safariの <strong>共有ボタン（四角から上矢印）</strong> ➔ <strong>「ホーム画面に追加」</strong> を押すと、上のタブやアドレスバーが完全に消えて <strong>全画面アプリ</strong> になります！
                </div>
            </div>

            <div style="background: #ffffff; padding: 10px; border-radius: 12px; display: inline-block;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://galakutar.github.io/Voice-Pad/" alt="QR Code" style="width: 150px; height: 150px; display: block;">
            </div>

            <div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 8px; font-family: monospace; font-size: 11px; color: #38bdf8; word-break: break-all; margin-top: 8px; width: 100%;">
                https://galakutar.github.io/Voice-Pad/
            </div>

            <button id="copy-url-btn" class="action-btn download-btn" style="width: 100%; margin-top: 6px;">🔗 URLをコピーする</button>
        </div>
    </div>

    <!-- アプリスクリプト -->
    <script src="app.js"></script>
</body>
</html>
